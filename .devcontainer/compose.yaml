services:

  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bullseye
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-mysql+pymysql://root:password@db:3306/tododb} 
    command: /bin/sh -c "while sleep 1000; do :; done"
    depends_on:
      - db

  db:
    image: mysql:8.4.4
    ports:
      - "3306:3306"
    volumes:
      - dbdaten:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-password}
      - MYSQL_DATABASE=tododb
  
  tool:
    image: phpmyadmin:5.2
    ports:
      - "8085:80"
    environment:
      - PMA_ARBITRARY=1
    depends_on: 
      - db

volumes:
  dbdaten: