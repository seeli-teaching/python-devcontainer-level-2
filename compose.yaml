services:

  app:
    build: .
    image: todo-api:prod
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4.4
    ports:
      - "3306:3306"
    volumes:
      - dbdaten:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=tododb
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  tool:
    image: phpmyadmin:5.2
    ports:
      - "8085:80"
    environment:
      - PMA_ARBITRARY=1
    depends_on: 
      - db

volumes:
  dbdaten:
